<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="description" content="AdForge mobile ad creator"><link rel="manifest" href="manifest.webmanifest"><title>AdForge</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:18px 15px 35px}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 18px}.logo{font-size:24px;font-weight:900}.logo b{color:#8066ff}.card{background:#141821;border:1px solid #262c38;border-radius:18px;padding:17px;margin-bottom:14px}h1{font-size:30px;line-height:1.05;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}p{color:#9da6b5;margin:0 0 18px;line-height:1.45}label{display:block;font-size:12px;font-weight:700;color:#aeb7c7;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.5px}input,textarea,select{width:100%;background:#0d1016;color:#fff;border:1px solid #303746;border-radius:11px;padding:13px;font:inherit;font-size:16px}textarea{min-height:100px;resize:vertical}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:10px 12px;border:1px solid #303746;border-radius:999px;font-size:13px;cursor:pointer}.pill.active{background:#8066ff;border-color:#8066ff}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:12px;background:#8066ff;color:#fff;padding:14px;margin-top:17px;font-weight:900;font-size:16px}.preview{aspect-ratio:1/1;border-radius:15px;background:linear-gradient(145deg,#30256b,#10131a);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.adbox{max-width:90%}.eyebrow{font-size:10px;letter-spacing:3px;color:#c1b8ff}.adbox h3{font-size:clamp(27px,8vw,42px);line-height:1.02;margin:12px 0}.copy{color:#d7dbe4;line-height:1.45;font-size:14px}.cta{display:inline-block;background:white;color:#111;padding:10px 16px;border-radius:9px;margin-top:16px;font-weight:900;font-size:13px}.secondary{width:100%;border:1px solid #303746;background:#252b38;color:#fff;border-radius:11px;padding:12px;margin-top:10px;font-weight:800}.output{white-space:pre-wrap;line-height:1.55;color:#dfe4ed;font-size:14px}.footer{text-align:center;color:#657083;font-size:11px;padding:5px}</style></head><body><div class="app"><header class="top"><div class="logo">Ad<b>Forge</b></div></header><section class="card"><h1>Create an ad.</h1><p>Build a ready-to-use ad concept from your phone.</p><label>Product / Service</label><input id="product" placeholder="e.g. Mobile car detailing"><label>Offer / Details</label><textarea id="details" placeholder="Price, benefits, location, promotion, what makes it different..."></textarea><label>Platform</label><div class="pills"><span class="pill active" data-v="Instagram">Instagram</span><span class="pill" data-v="Facebook">Facebook</span><span class="pill" data-v="TikTok">TikTok</span><span class="pill" data-v="YouTube">YouTube</span></div><label>Goal</label><select id="goal"><option>Get more sales</option><option>Generate leads</option><option>Drive traffic</option><option>Promote an offer</option><option>Build awareness</option></select><label>Tone</label><select id="tone"><option>Bold & direct</option><option>Professional</option><option>Friendly</option><option>Luxury</option><option>Urgent</option></select><button class="primary" onclick="generateAd()">Generate Ad</button></section><section class="card"><h2>Preview</h2><div class="preview"><div class="adbox"><div class="eyebrow" id="eyebrow">ADFORGE</div><h3 id="headline">Your headline will appear here.</h3><div class="copy" id="copy">Enter your offer and generate an ad.</div><div class="cta" id="cta">LEARN MORE</div></div></div><button class="secondary" onclick="downloadAd()">Download Ad</button></section><section class="card"><h2>Ad Copy</h2><div id="output" class="output">Nothing generated yet.</div></section><div class="footer">AdForge</div></div><script>let platform='Instagram';document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');platform=p.dataset.v});function generateAd(){const product=document.getElementById('product').value.trim()||'Your Product',details=document.getElementById('details').value.trim(),goal=document.getElementById('goal').value,tone=document.getElementById('tone').value;const first=details.split(/[.!?]/)[0].trim()||'A better way to get the result you want.';const headline=goal.includes('sales')?`${product}: Get More. Stress Less.`:goal.includes('leads')?`Ready for a Better ${product}?`:goal.includes('offer')?`Don\'t Miss This ${product} Offer`:`${product} — Built to Get Results`;const body=`${first} ${details?'':'Give customers a clear reason to choose your offer.'} ${tone==='Urgent'?'Act now while the offer is available.':''}`;const cta=goal.includes('sales')?'SHOP NOW':goal.includes('leads')?'GET STARTED':goal.includes('offer')?'CLAIM OFFER':'LEARN MORE';document.getElementById('eyebrow').textContent=platform.toUpperCase()+' AD';document.getElementById('headline').textContent=headline;document.getElementById('copy').textContent=body;document.getElementById('cta').textContent=cta;document.getElementById('output').textContent=`HEADLINE\n${headline}\n\nPRIMARY COPY\n${body}\n\nCTA\n${cta}\n\nPLATFORM\n${platform}\n\nGOAL\n${goal}\n\nTONE\n${tone}\n\nHASHTAGS\n#${product.replace(/[^a-z0-9]/gi,'').toLowerCase()} #smallbusiness #deals`};function downloadAd(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><defs><linearGradient id="g"><stop stop-color="#30256b"/><stop offset="1" stop-color="#10131a"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><text x="540" y="300" fill="#c1b8ff" font-size="27" text-anchor="middle" font-family="Arial" letter-spacing="5">${esc(document.getElementById('eyebrow').textContent)}</text><text x="540" y="455" fill="white" font-size="58" font-weight="700" text-anchor="middle" font-family="Arial">${esc(document.getElementById('headline').textContent)}</text><text x="540" y="560" fill="#d7dbe4" font-size="28" text-anchor="middle" font-family="Arial">${esc(document.getElementById('copy').textContent).slice(0,80)}</text><rect x="390" y="780" width="300" height="76" rx="14" fill="white"/><text x="540" y="829" fill="#111" font-size="27" font-weight="700" text-anchor="middle" font-family="Arial">${esc(document.getElementById('cta').textContent)}</text></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='adforge-ad.svg';a.click()}function esc(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]))}</script></body></html>
