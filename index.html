<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>AdForge</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:18px 15px 35px}.top{padding:4px 2px 18px}.logo{font-size:24px;font-weight:900}.logo b{color:#8066ff}.card{background:#141821;border:1px solid #262c38;border-radius:18px;padding:17px;margin-bottom:14px}h1{font-size:30px;line-height:1.05;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}p{color:#9da6b5;margin:0 0 18px;line-height:1.45}label{display:block;font-size:12px;font-weight:700;color:#aeb7c7;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.5px}input,textarea,select{width:100%;background:#0d1016;color:#fff;border:1px solid #303746;border-radius:11px;padding:13px;font:inherit;font-size:16px}textarea{min-height:100px;resize:vertical}.photo{display:flex;gap:10px;align-items:center}.photo input{padding:10px}.photo-preview{display:none;width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #303746}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:10px 12px;border:1px solid #303746;border-radius:999px;font-size:13px;cursor:pointer}.pill.active{background:#8066ff;border-color:#8066ff}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:12px;background:#8066ff;color:#fff;padding:14px;margin-top:17px;font-weight:900;font-size:16px}.primary:disabled{opacity:.6}.preview{aspect-ratio:1/1;border-radius:15px;background:linear-gradient(145deg,#30256b,#10131a);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;border-radius:12px}.adbox{max-width:90%}.eyebrow{font-size:10px;letter-spacing:3px;color:#c1b8ff}.adbox h3{font-size:clamp(27px,8vw,42px);line-height:1.02;margin:12px 0}.copy{color:#d7dbe4;line-height:1.45;font-size:14px}.cta{display:inline-block;background:white;color:#111;padding:10px 16px;border-radius:9px;margin-top:16px;font-weight:900;font-size:13px}.secondary{width:100%;border:1px solid #303746;background:#252b38;color:#fff;border-radius:11px;padding:12px;margin-top:10px;font-weight:800}.output{white-space:pre-wrap;line-height:1.55;color:#dfe4ed;font-size:14px}.status{font-size:12px;color:#9da6b5;margin-top:10px}.footer{text-align:center;color:#657083;font-size:11px;padding:5px}</style></head><body><div class="app"><header class="top"><div class="logo">Ad<b>Forge</b></div></header><section class="card"><h1>Create an ad.</h1><p>AI-powered ads from your phone.</p><label>Product / Service</label><input id="product" placeholder="e.g. Mobile car detailing"><label>Info</label><textarea id="details" placeholder="Describe the product, features, price, website, location, target customer, or anything the AI should know..."></textarea><label>Product Photo</label><div class="photo"><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><img id="photoPreview" class="photo-preview" alt="Product preview"></div><label>Platform</label><div class="pills"><span class="pill active" data-v="Instagram">Instagram</span><span class="pill" data-v="Facebook">Facebook</span><span class="pill" data-v="TikTok">TikTok</span><span class="pill" data-v="YouTube">YouTube</span></div><label>Goal</label><select id="goal"><option>Get more sales</option><option>Generate leads</option><option>Drive traffic</option><option>Promote an offer</option><option>Build awareness</option></select><label>Tone</label><select id="tone"><option>Bold & direct</option><option>Professional</option><option>Friendly</option><option>Luxury</option><option>Urgent</option></select><button id="generate" class="primary">Generate AI Ad</button><div id="status" class="status"></div></section><section class="card"><h2>Preview</h2><div class="preview" id="preview"><div class="adbox"><div class="eyebrow" id="eyebrow">ADFORGE</div><h3 id="headline">Your headline will appear here.</h3><div class="copy" id="copy">Add your product photo and info, then generate.</div><div class="cta" id="cta">GET STARTED</div></div></div><button class="secondary" onclick="downloadAd()">Download Ad</button></section><section class="card"><h2>Ad Copy</h2><div id="output" class="output">Nothing generated yet.</div></section><div class="footer">AdForge AI</div></div><script>const API='https://purple-moon-0361.in0326279.workers.dev';let platform='Instagram',photoData='';document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');platform=p.dataset.v});document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){document.getElementById('status').textContent='Photo must be under 8 MB.';e.target.value='';return}const r=new FileReader();r.onload=()=>{photoData=r.result;const im=document.getElementById('photoPreview');im.src=photoData;im.style.display='block'};r.readAsDataURL(f)};document.getElementById('generate').onclick=async()=>{const product=document.getElementById('product').value.trim(),details=document.getElementById('details').value.trim(),goal=document.getElementById('goal').value,tone=document.getElementById('tone').value,status=document.getElementById('status'),btn=document.getElementById('generate');if(!product){status.textContent='Enter a product or service first.';return}btn.disabled=true;status.textContent=photoData?'Generating ad with your product photo...':'Generating AI ad...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product,details,platform,goal,tone,photo:photoData})});if(!r.ok){const msg=await r.text();throw new Error(msg||'AI request failed')}const d=await r.json();if(d.image){document.getElementById('preview').innerHTML='<img src="'+d.image+'" alt="Generated ad">';if(d.copy)document.getElementById('output').textContent=d.copy;status.textContent='Finished ad generated.';return}const text=d.choices?.[0]?.message?.content||'No AI response returned.';document.getElementById('eyebrow').textContent=platform.toUpperCase()+' AD';document.getElementById('output').textContent=text;let headline=text,copy=text,cta='GET STARTED';try{const clean=text.replace(/```json|```/g,'').trim(),j=JSON.parse(clean);headline=j.headline||headline;copy=j.primaryCopy||copy;cta=j.cta||cta;document.getElementById('output').textContent='HEADLINE\n'+headline+'\n\nPRIMARY COPY\n'+copy+'\n\nCTA\n'+cta+'\n\nHOOK\n'+(j.hook||'')+'\n\nHASHTAGS\n'+(j.hashtags||[]).join(' ')}catch{}document.getElementById('headline').textContent=headline;document.getElementById('copy').textContent=copy;document.getElementById('cta').textContent=cta;status.textContent='AI ad generated.'}catch(e){status.textContent='Generation failed: '+e.message.slice(0,180)}finally{btn.disabled=false}};function downloadAd(){const img=document.querySelector('#preview img');if(img){const a=document.createElement('a');a.href=img.src;a.download='adforge-ad.png';a.click();return}const esc=s=>String(s).replace(/[<>&'\"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','\\':'&#92;','"':'&quot;'}[c]));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#161a24"/><text x="540" y="300" fill="#c1b8ff" font-size="27" text-anchor="middle" font-family="Arial">${esc(document.getElementById('eyebrow').textContent)}</text><text x="540" y="455" fill="white" font-size="58" font-weight="700" text-anchor="middle" font-family="Arial">${esc(document.getElementById('headline').textContent)}</text><text x="540" y="560" fill="#d7dbe4" font-size="28" text-anchor="middle" font-family="Arial">${esc(document.getElementById('copy').textContent).slice(0,80)}</text><rect x="390" y="780" width="300" height="76" rx="14" fill="white"/><text x="540" y="829" fill="#111" font-size="27" font-weight="700" text-anchor="middle" font-family="Arial">${esc(document.getElementById('cta').textContent)}</text></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='adforge-ad.svg';a.click()}</script></body></html>
